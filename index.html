  { q: "現在的你，最想聽到哪一句？", o: [
    ["🍵", "「辛苦了，休息一下吧」", { tired: 2 }],
    ["🌤️", "「別擔心，會過去的」", { anxious: 2 }],
    ["🧭", "「慢慢來，你會找到的」", { lost: 2 }],
    ["🤝", "「我懂你的委屈」", { upset: 2 }],
    ["🤗", "「你已經做得很好了」", { down: 2 }],
    ["✨", "「放手去做吧」", { ready: 2 }],
    ["🌻", "「今天有你真好」", { good: 2 }],
  ]},
];

const $ = (id) => document.getElementById(id);
let answers = [], step = 0, state = null, qi = 0;

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function renderQuestion() {
  const item = QUESTIONS[step];
  $("bar").style.width = `${(step / QUESTIONS.length) * 100}%`;
  $("qno").textContent = `${step + 1} / ${QUESTIONS.length}`;
  $("qtext").textContent = item.q;
  $("opts").innerHTML = "";
  item.o.forEach(([emo, text, score], i) => {
    const b = document.createElement("button");
    b.className = "opt" + (answers[step] === i ? " picked" : "");
    b.innerHTML = `<span class="emo">${emo}</span><span>${text}</span>`;
    b.onclick = () => pick(i, b);
    $("opts").appendChild(b);
  });
  $("back").style.visibility = step === 0 ? "hidden" : "visible";
}

function pick(i, el) {
  answers[step] = i;
  el.classList.add("picked");
  setTimeout(() => {
    if (step < QUESTIONS.length - 1) { step++; renderQuestion(); }
    else finish();
  }, 220);
}

function finish() {
  $("bar").style.width = "100%";
  const total = {};
  answers.forEach((a, s) => Object.entries(QUESTIONS[s].o[a][2]).forEach(([k, v]) => (total[k] = (total[k] || 0) + v)));
  const best = Math.max(...Object.values(total));
  const tied = Object.keys(total).filter((k) => total[k] === best);
  // 同分時看最後一題選了什麼（最能代表「現在想聽的話」）
  const lastPick = Object.keys(QUESTIONS[4].o[answers[4]][2])[0];
  state = tied.includes(lastPick) ? lastPick : tied[Math.floor(Math.random() * tied.length)];
  qi = Math.floor(Math.random() * 3);
  renderResult();
  show("result");
}

function renderResult() {
  const r = RESULTS[state], q = r.quotes[qi];
  $("rtitle").textContent = r.title;
  $("rlead").textContent = r.lead;
  $("qbody").textContent = q.t;
  $("qsrc").innerHTML = `出處：<a href="${q.u}" target="_blank" rel="noopener">${q.s}</a>`;
  $("note").innerHTML = `<b>小編想說：</b>${q.n}`;
}

// 9:16 限動圖卡：用 canvas 畫，產生圖片讓使用者長按儲存（IG 內建瀏覽器常擋下載）
function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  text.split("\n").forEach((para) => {
    let line = "";
    for (const ch of para) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        // 標點不放行首
        if ("，。、；：！？」）』".includes(ch)) { lines.push(test); line = ""; continue; }
        lines.push(line); line = ch;
      } else line = test;
    }
    if (line) lines.push(line);
  });
  return lines;
}

async function makeCard() {
  const r = RESULTS[state], q = r.quotes[qi];
  await Promise.all([document.fonts.load('700 60px "Noto Serif TC"'), document.fonts.load('500 40px "Noto Sans TC"')]).catch(() => {});
  const W = 1080, H = 1920, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#3d2e22"); g.addColorStop(1, "#1a130e");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const glow = x.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.45, 700);
  glow.addColorStop(0, "rgba(201,155,82,.28)"); glow.addColorStop(1, "rgba(201,155,82,0)");
  x.fillStyle = glow; x.fillRect(0, 0, W, H);

  x.textAlign = "center";
  x.fillStyle = "#d9b26a";
  x.font = '500 38px "Noto Sans TC", sans-serif';
  x.fillText("給此刻的你", W / 2, 330);
  x.font = '700 64px "Noto Serif TC", serif';
  x.fillStyle = "#f3e7d3";
  x.fillText(r.title, W / 2, 425);
  x.strokeStyle = "rgba(217,178,106,.6)"; x.lineWidth = 2;
  x.beginPath(); x.moveTo(W / 2 - 70, 480); x.lineTo(W / 2 + 70, 480); x.stroke();

  let size = 62;
  x.font = `700 ${size}px "Noto Serif TC", serif`;
  let lines = wrapLines(x, q.t, 820);
  while (lines.length > 8 && size > 46) { size -= 4; x.font = `700 ${size}px "Noto Serif TC", serif`; lines = wrapLines(x, q.t, 820); }
  const lh = size * 1.75, top = 960 - (lines.length * lh) / 2 + size * 0.4;
  x.fillStyle = "#fbf3e4";
  lines.forEach((l, i) => x.fillText(l, W / 2, top + i * lh));

  const after = top + lines.length * lh + 40;
  x.fillStyle = "#d9b26a";
  x.font = '500 40px "Noto Sans TC", sans-serif';
  x.fillText("── 星雲大師", W / 2, after + 30);
  x.fillStyle = "rgba(243,231,211,.6)";
  x.font = '400 28px "Noto Sans TC", sans-serif';
  x.fillText(q.s, W / 2, after + 85);

  x.fillStyle = "rgba(243,231,211,.75)";
  x.font = '500 34px "Noto Sans TC", sans-serif';
  x.fillText("佛光山 @fgs_ig", W / 2, H - 230);
  $("cardimg").src = c.toDataURL("image/jpeg", 0.92);
  show("share");
}

$("start").onclick = () => { answers = []; step = 0; renderQuestion(); show("quiz"); };
$("back").onclick = () => { if (step > 0) { step--; renderQuestion(); } };
$("another").onclick = () => { qi = (qi + 1) % 3; renderResult(); };
$("again").onclick = () => show("intro");
$("makecard").onclick = makeCard;
$("backresult").onclick = () => show("result");
</script>
</body>
</html>
